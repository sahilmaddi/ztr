services:
  browser:
    image: selenium/standalone-chrome:4.27.0-20241127
    shm_size: 2gb
    ports:
      - "4444:4444"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=ztr-local-scan-key
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    expose:
      - "8080"


  juice-shop:
    image: bkimminich/juice-shop
    profiles: ["vulnerable-lab"]
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"

  web:
    build: ./apps/web
    ports:
      - "4200:80"
    depends_on:
      - regression

  regression:
    build: ./services/regression
    environment:
      SELENIUM_URL: http://browser:4444
      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ztr-local-scan-key
    ports:
      - "8100:8100"
    depends_on:
      - browser
      - zap

  robot:
    build: ./services/robot
    environment:
      SELENIUM_URL: http://browser:4444
    ports:
      - "8001:8001"
    depends_on:
      - browser

  gitea:
    image: gitea/gitea:1.23.8
    profiles: ["ci"]
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: jenkins
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - gitea-data:/data

  jenkins:
    build: ./services/jenkins
    profiles: ["ci"]
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?Set JENKINS_ADMIN_ID in .env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env}
      GITEA_REPO_OWNER: ${GITEA_REPO_OWNER:?Set GITEA_REPO_OWNER in .env}
      GITEA_REPO_NAME: ${GITEA_REPO_NAME:?Set GITEA_REPO_NAME in .env}
      GITEA_WEBHOOK_TOKEN: ${GITEA_WEBHOOK_TOKEN:?Set GITEA_WEBHOOK_TOKEN in .env}
      COMPOSE_PROJECT_NAME: ztr
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    depends_on:
      - gitea

volumes:
  gitea-data:
  jenkins-data:
